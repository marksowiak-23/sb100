<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <!-- Primary Search Engine Meta Tags -->
    <title>BackStory — Share Your Story, Inspire the World & Connect</title>
    <meta name="title" content="BackStory — Share Your Story, Inspire the World & Connect" />
    <meta name="description" content="BackStory is the creative storytelling and social connection platform where people of all ages share real life moments, personal journeys, adventures, and meaningful memories." />
    <meta name="keywords" content="share your story, storytelling platform, personal journeys, life experiences, creative writing, connect with friends, true stories, young writers, story community, digital memoirs, life moments, backstory" />
    <meta name="author" content="BackStory" />
    <meta name="robots" content="%VITE_ROBOTS%" />
    <meta name="theme-color" content="#FDFCFB" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BackStory" />
    <meta property="og:title" content="BackStory — Share Your Story, Inspire the World & Connect" />
    <meta property="og:description" content="Share what makes your journey unique. Explore authentic stories, connect with friends, and inspire others on BackStory." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=1200&h=630&fit=crop" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BackStory — Share Your Story, Inspire the World & Connect" />
    <meta name="twitter:description" content="Share what makes your journey unique. Explore authentic stories, connect with friends, and inspire others on BackStory." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=1200&h=630&fit=crop" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "BackStory",
        "url": "https://backstory.ai",
        "description": "BackStory is the creative storytelling and social connection platform where people of all ages share real life moments, personal journeys, adventures, and meaningful memories.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://backstory.ai/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <!-- Google Tag Manager (GTM) dataLayer bootstrap -->
    <script>
      window.dataLayer = window.dataLayer || [];
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
